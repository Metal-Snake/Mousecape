# Settings for fork-check.sh (see FORK-CHECK.md). Read by the script as shell code.

# Name in the SessionStart reminder.
NAME="Mousecape and MaCursor"
# Watched with all forks, recursively. sdmj76/Mousecape-swiftUI is a fork of the
# original Mousecape, so it and its forks are part of the first network.
NETWORKS="alexzielenski/Mousecape writronic/MaCursor"
# Watched repositories outside those fork networks, without their forks.
EXTRA="kwd421/macOS_Cursie Juwan-Hwang/macOS27-Cursors"
# Repositories whose pull requests and issues "upstream" lists.
ISSUES="alexzielenski/Mousecape sdmj76/Mousecape-swiftUI writronic/MaCursor"
# Before the first check, "upstream" lists from this date (not needed any more).
ISSUES_SINCE=""
# Our own forks are left out.
EXCLUDE_OWNERS="Metal-Snake"
CHECK_FILE=FORK-CHECK.md
HEADS=Scripts/fork-heads.tsv
